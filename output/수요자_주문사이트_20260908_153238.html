<style>
:root{--navy:#0c3461;--blue:#0a7065;--blue2:#0d9488;--sky:#e6f7f5;--line:#b2dcd8;--herb:#3d7a3a;--gold:#b87333}

body{margin:0;background:linear-gradient(135deg,#f0faf8 0%,#eaf4f0 100%);min-height:100vh}

.nav-glass{background:linear-gradient(135deg,rgba(12,52,97,0.97) 0%,rgba(10,112,101,0.93) 100%);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,0.1)}
.btn-primary{background:linear-gradient(135deg,var(--blue2) 0%,#0a5e56 100%);color:#fff;border:none;cursor:pointer;transition:all .2s;border-radius:12px}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(13,148,136,.4)}
.btn-green{background:linear-gradient(135deg,#1a9e52,#0d7a3e);color:#fff;border:none;cursor:pointer;border-radius:12px;transition:all .2s}
.btn-green:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(13,122,62,.3)}
.btn-outline{background:transparent;border:1.5px solid var(--blue2);color:var(--blue2);cursor:pointer;transition:all .2s;border-radius:10px}
.btn-outline:hover{background:var(--sky)}
.btn-herb{background:linear-gradient(135deg,var(--herb),#2d5c2a);color:#fff;border:none;cursor:pointer;border-radius:12px;transition:all .2s}
.btn-herb:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(61,122,58,.35)}
.btn-gold{background:linear-gradient(135deg,#b87333,#8b5a24);color:#fff;border:none;cursor:pointer;border-radius:12px;transition:all .2s}

@keyframes toastIn{from{transform:translateX(120px);opacity:0}to{transform:translateX(0);opacity:1}}

<script>
const STORAGE_KEY='b2g_v3';
const STATUS_LABELS={draft:'임시저장',submitted:'접수대기',quoted:'견적발송',quote_approved:'견적승인',in_progress:'작업중',proof_review:'시안확인',proof_approved:'시안승인',delivering:'납품중',completed:'완료',cancelled:'취소'};
const ORDER_TYPES={supplies:'사무용품',toner:'토너·소모품',banner:'현수막',advertising:'광고물',construction:'수선·공사',service:'용역'};
const ORDER_ICONS={supplies:'🖊️',toner:'🖨️',banner:'🪧',advertising:'📄',construction:'🔧',service:'🤝'};
const uid=()=>Math.random().toString(36).substr(2,9);
const today=()=>new Date().toISOString().split('T')[0];
const fmt=d=>d?d.replace(/-/g,'.'):'—';
const comma=n=>Number(n||0).toLocaleString();
// PIN 해시 (djb2 변형, salt=userId)
function hashPin(pin,salt){let h=5381;const s=pin+':'+salt;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))&0x7fffffff;return h.toString(36)}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function quoteTotal(q){return Number(q?.total??q?.totalAmt??0)}
function quoteSub(q){return Number(q?.subtotal??q?.supplyAmt??0)}
function quoteVat(q){return Number(q?.vat??q?.vatAmt??0)}
function msgText(m){return m.text??m.body??''}
function needsProof(type){return type==='banner'||type==='advertising'}
const CAT_TO_TYPE={furniture:'supplies',toner:'toner',cleaning:'supplies',banner:'banner',construction:'construction',service:'service'};
function orderDetailRows(o){
  const d=o.detail||{}, rows=[];
  const add=(k,v)=>{if(v===undefined||v===null||v===''||(Array.isArray(v)&&!v.length))return;rows.push(`<div><span class="text-gray-400 block">${esc(k)}</span><span class="font-semibold whitespace-pre-wrap">${esc(Array.isArray(v)?v.join(', '):String(v))}</span></div>`)};
  if(o.type==='supplies'&&Array.isArray(d.items)&&d.items.length){
    return `<div class="col-span-2 mt-2">${d.items.map(it=>`<div class="text-sm py-1 border-b border-gray-50">${esc(it.name)} <span class="text-gray-400">${esc(it.spec||'')} · ${comma(it.qty)} ${esc(it.unit||'')}</span></div>`).join('')}</div>`;
  }
  if(o.type==='toner'){add('제조사',d.maker);add('기종',d.model);add('토너번호',d.no);add('색상',d.color);add('수량',d.qty);}
  if(o.type==='banner'){add('종류',d.bannerKind);add('가로(cm)',d.width);add('세로(cm)',d.height);add('설치위치',d.location);add('수량',d.qty);add('홍보문구',d.text);add('시안회신',d.contact||d.replyPhone||d.replyEmail);}
  if(o.type==='advertising'){add('종류',d.kind||d.etcDesc);add('규격',d.spec);add('수량',d.qty);add('도수',d.dpi||d.color);add('시안회신',d.contact||d.replyPhone||d.replyEmail);}
  if(o.type==='construction'){add('금액구간',d.budget||d.conRange);add('분야',d.fields||d.conField);add('작업위치',d.location);add('작업내용',d.work||d.desc);}
  if(o.type==='service'){add('용역종류',d.svcType);add('범위',d.scope);add('기간',(d.startDate||d.endDate)?`${d.startDate||''} ~ ${d.endDate||''}`:'');add('내용',d.content||d.desc);}
  return rows.join('');
}
function captureForm(){
  const g=id=>document.getElementById(id)?.value;
  const d={};
  ['desiredDate','orderNote','taxEmail','deliveryAddr','tMaker','tModel','tNo','tColor','tQty','bW','bH','bPos','bQty','bText','bContact','adKind','adOther','adSpec','adQty','adDpi','adContact','cLoc','cWork','svcType','svcScope','svcStart','svcEnd','svcContent'].forEach(id=>{const v=g(id);if(v!==undefined)d[id]=v});
  d.bType=document.querySelector('input[name="bType"]:checked')?.value||'';
  d.cBudget=document.querySelector('input[name="cBudget"]:checked')?.value||'';
  d.cField=[...document.querySelectorAll('input[name="cField"]:checked')].map(x=>x.value);
  d.supply=[...document.querySelectorAll('#supplyRows .grid')].map(r=>{const ins=r.querySelectorAll('input');return[ins[0]?.value||'',ins[1]?.value||'',ins[2]?.value||'1',ins[3]?.value||'']});
  return d;
}
function applyForm(d){
  if(!d)return;
  Object.keys(d).forEach(k=>{
    if(['bType','cBudget','cField','supply'].includes(k))return;
    const el=document.getElementById(k);if(el&&d[k]!=null)el.value=d[k];
  });
  if(d.bType){const r=document.querySelector('input[name="bType"][value="'+d.bType+'"]');if(r){r.checked=true;const st=document.getElementById('bStreet');if(st)st.style.display=d.bType==='street'?'grid':'none';}}
  if(d.cBudget){const r=document.querySelector('input[name="cBudget"][value="'+d.cBudget+'"]');if(r)r.checked=true;}
  (d.cField||[]).forEach(v=>{const r=document.querySelector('input[name="cField"][value="'+v+'"]');if(r)r.checked=true;});
  if(d.supply&&d.supply.length&&document.getElementById('supplyRows')){
    d.supply.forEach((row,i)=>{
      if(i>0)addSupplyRow();
      const grid=document.querySelectorAll('#supplyRows .grid')[i];
      if(!grid)return;
      const ins=grid.querySelectorAll('input');
      row.forEach((v,j)=>{if(ins[j])ins[j].value=v});
    });
  }
}
function setType(k){const d=captureForm();selType=k;render();applyForm({desiredDate:d.desiredDate,orderNote:d.orderNote,taxEmail:d.taxEmail,deliveryAddr:d.deliveryAddr});}
function setLoc(v){const d=captureForm();selLoc=v;render();applyForm(d);}
function setTax(v){const d=captureForm();selTax=v;render();applyForm(d);}

// ── Store ──────────────────────────────────────────────────
const Store={
  data:{users:[],orders:[],quotes:[],messages:[],docs:[],catalog:[],cart:{},favorites:[],ratings:[],settings:{bizName:'제천 납품업체',bizNo:'123-45-67890',ceo:'홍길동',phone:'043-123-4567',addr:'충북 제천시 의림대로 126',bank:'농협 301-0012-3456-71'},regionConfig:{govName:'제천시청',govBizNo:'307-83-00123',cityName:'제천',cityFull:'충청북도 제천시',lunchEnabled:true,deptGroups:DEPTS,restaurants:RESTAURANTS}},
  save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(this.data))},
  load(){
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw)try{this.data=JSON.parse(raw)}catch(e){}
    if(!this.data.users||!this.data.users.length)this.seed();
    // 카탈로그 구조 변경 시 자동 재시드 (supplies→furniture, 기타 추가)
    if(!this.data.catalog||!this.data.catalog.length||!this.data.catalog.some(p=>p.cat==='furniture'))this.seedCatalog();
    ['cart','docs','messages','quotes','orders','users','favorites','ratings'].forEach(k=>{if(!this.data[k])this.data[k]=k==='cart'?{}:[]});
    // 타지역 배포 대응: 조직도·맛집·지역명은 공급자 사이트 설정에서 편집 가능한 공용 설정으로 이전
    if(!this.data.regionConfig)this.data.regionConfig={govName:'제천시청',govBizNo:'307-83-00123',cityName:'제천',cityFull:'충청북도 제천시',lunchEnabled:true,deptGroups:DEPTS,restaurants:RESTAURANTS};
    if(!this.data.regionConfig.deptGroups||!this.data.regionConfig.deptGroups.length)this.data.regionConfig.deptGroups=DEPTS;
    if(!this.data.regionConfig.restaurants)this.data.regionConfig.restaurants=RESTAURANTS;
    if(this.data.regionConfig.lunchEnabled===undefined)this.data.regionConfig.lunchEnabled=true;
    this.normalize();
  },
  normalize(){
    (this.data.quotes||[]).forEach(q=>{
      const total=Number(q.total??q.totalAmt??0), sub=Number(q.subtotal??q.supplyAmt??0), vat=Number(q.vat??q.vatAmt??0);
      q.total=q.totalAmt=total; q.subtotal=q.supplyAmt=sub; q.vat=q.vatAmt=vat;
    });
    (this.data.messages||[]).forEach(m=>{const t=m.text??m.body??''; m.text=m.body=t;});
  },
  seed(){
    this.data.users=[
      {id:'u1',role:'admin',email:'admin@test.com',pw:'1234',name:'관리자',dept:''},
      {id:'u2',role:'staff',email:'staff@test.com',pw:'1234',name:'김담당',dept:''},
      {id:'u3',role:'client',name:'이민준',dept:'기획예산과'},
      {id:'u4',role:'client',name:'박서연',dept:'세무과'}

function filterDeptList(q){
  const el=document.getElementById('deptList');
  if(!el)return;
  const deptGroups=Store.data.regionConfig.deptGroups;
  if(!q){el.innerHTML=deptGroups.map(g=>`<div class="dept-group">${g.group}</div>${g.items.map(d=>`<div class="dept-item${selDept===d?' selected':''}" onclick="pickDept('${d}')">${d}</div>`).join('')}`).join('');return;}
  let html='';
  deptGroups.forEach(g=>{const f=g.items.filter(d=>d.includes(q)||g.group.includes(q));if(f.length){html+=`<div class="dept-group">${g.group}</div>${f.map(d=>`<div class="dept-item${selDept===d?' selected':''}" onclick="pickDept('${d}')">${d}</div>`).join('')}`;}});
  el.innerHTML=html||'<p class="text-center text-gray-400 text-sm py-6">검색 결과 없음</p>';
}
function pickDept(d){selDept=d;render();setTimeout(()=>{const s=document.getElementById('deptSearch');if(s)s.focus()},50)}
function clearDept(){selDept='';render()}
function doLogin(){
  const name=(document.getElementById('loginName')?.value||'').trim();
  if(!selDept){showErr('부서를 선택해주세요.');return}
  if(!name){showErr('이름을 입력해주세요.');return}
  let u=Store.data.users.find(x=>x.role==='client'&&x.dept===selDept&&x.name===name);
  if(!u){u={id:uid(),role:'client',name,dept:selDept};Store.data.users.push(u);Store.save()}
  loginTempUser=u;
  loginStep=u.pinHash?'pin-verify':'pin-new';
  render();
  setTimeout(()=>{const el=document.getElementById(u.pinHash?'verifyPin':'newPin');if(el){el.focus();}},80);
}
function showErr(m){const e=document.getElementById('loginErr');if(e){e.textContent=m;e.style.display='block'}}
function logout(){CU=null;selDept='';loginStep='main';loginTempUser=null;go('login')}

function updatePinDots(input,prefix){
  const len=input.value.length;
  for(let i=1;i<=4;i++){const d=document.getElementById(prefix+'_'+i);if(d)d.style.background=i<=len?'var(--blue2)':'#e5e7eb';}
}
function showPinErr(msg){const e=document.getElementById('pinErr');if(e){e.textContent=msg;e.style.display='block';setTimeout(()=>e.style.display='none',2500);}}
function doSetPin(){
  const pin=(document.getElementById('newPin')?.value||'');
  const conf=(document.getElementById('confirmPin')?.value||'');
  if(!/^\d{4}$/.test(pin)){showPinErr('4자리 숫자만 입력해주세요.');return}
  if(pin!==conf){showPinErr('비밀번호가 일치하지 않습니다.');document.getElementById('confirmPin').value='';updatePinDots({value:''},'d2');return}
  loginTempUser.pinHash=hashPin(pin,loginTempUser.id);
  const idx=Store.data.users.findIndex(u=>u.id===loginTempUser.id);
  if(idx>=0)Store.data.users[idx]=loginTempUser;
  Store.save();
  CU=loginTempUser;loginStep='main';loginTempUser=null;
  go('dashboard');
}
function doVerifyPin(){
  const pin=(document.getElementById('verifyPin')?.value||'');
  if(!/^\d{4}$/.test(pin)){showPinErr('4자리 숫자를 입력해주세요.');return}
  if(hashPin(pin,loginTempUser.id)!==loginTempUser.pinHash){
    showPinErr('비밀번호가 올바르지 않습니다. 다시 시도해주세요.');
    const el=document.getElementById('verifyPin');if(el){el.value='';updatePinDots({value:''},'v');}
    return;
  }
  CU=loginTempUser;loginStep='main';loginTempUser=null;
  go('dashboard');
}
function resetPin(){
  toast('로그인 화면에서는 비밀번호를 초기화할 수 없습니다. 로그인한 뒤 열쇠 아이콘으로 변경하세요.');
}

function handlePhotos(input){
  const files=Array.from(input.files).slice(0,3);
  pendingPhotos=[];
  const prev=document.getElementById('photoPreview');
  if(prev)prev.innerHTML='<span class="text-xs text-gray-400">읽는 중...</span>';
  let done=0;
  if(!files.length){if(prev)prev.innerHTML='';return;}
  files.forEach((file,i)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      pendingPhotos[i]=e.target.result;
      done++;
      if(done===files.length){
        if(prev)prev.innerHTML=pendingPhotos.map(b=>`<img src="${b}" style="width:80px;height:80px;object-fit:cover;border-radius:8px;border:1.5px solid var(--line)">`).join('');
      }
    };
    reader.readAsDataURL(file);
  });
}

function addSupplyRow(){
  const c=document.getElementById('supplyRows');if(!c)return;

}

function submitOrder(){
  if(!selType){toast('주문 유형을 선택해주세요.');return}
  if(!selTax){toast('전자세금계산서 방식을 선택해주세요.');return}
  const desiredDate=document.getElementById('desiredDate')?.value||today();
  const note=document.getElementById('orderNote')?.value||'';
  const taxEmail=document.getElementById('taxEmail')?.value||'';
  const deliveryAddr=selLoc==='office'?`${CU.dept} 사무실`:document.getElementById('deliveryAddr')?.value||'';
  let detail={},title='';
  if(selType==='supplies'){
    const rows=document.querySelectorAll('#supplyRows .grid');
    const items=[];
    rows.forEach(r=>{const ins=r.querySelectorAll('input');if(ins[0]?.value)items.push({name:ins[0].value,spec:ins[1]?.value||'',qty:Number(ins[2]?.value||1),unit:ins[3]?.value||'개'})});
    if(!items.length){toast('품목을 1개 이상 입력하세요.');return}
    detail={items};title=items[0].name+(items.length>1?` 외 ${items.length-1}종`:'');
  }else if(selType==='toner'){
    const maker=document.getElementById('tMaker')?.value||'';
    const model=document.getElementById('tModel')?.value||'';
    detail={maker,model,no:document.getElementById('tNo')?.value||'',color:document.getElementById('tColor')?.value||'',qty:Number(document.getElementById('tQty')?.value||1)};
    if(!maker&&!model&&!detail.no){toast('제조사, 기종 또는 토너 모델번호를 입력하세요.');return}
    title=`${maker} ${model} 토너`.trim()||'토너·소모품 주문';
  }else if(selType==='banner'){
    const kind=document.querySelector('input[name="bType"]:checked')?.value||'';
    if(!kind){toast('현수막 종류(지정게시대/거리용)를 선택해주세요.');return}
    const text=(document.getElementById('bText')?.value||'').trim();
    const contact=(document.getElementById('bContact')?.value||'').trim();
    detail={bannerKind:kind==='street'?'거리용':'지정게시대',qty:Number(document.getElementById('bQty')?.value||1),text,contact};
    if(kind==='street'){
      detail.width=document.getElementById('bW')?.value||'';
      detail.height=document.getElementById('bH')?.value||'';
      detail.location=document.getElementById('bPos')?.value||'';
    }
    title=text?(text.length>24?text.slice(0,24)+'…':text):(kind==='street'?'거리용 현수막':'지정게시대 현수막');
  }else if(selType==='advertising'){
    let kind=document.getElementById('adKind')?.value||'';
    if(kind==='기타')kind=(document.getElementById('adOther')?.value||'').trim()||'기타';
    if(!kind){toast('광고물 종류를 선택해주세요.');return}
    detail={kind,spec:document.getElementById('adSpec')?.value||'',qty:Number(document.getElementById('adQty')?.value||1),dpi:document.getElementById('adDpi')?.value||'',contact:document.getElementById('adContact')?.value||''};
    title=kind+' 제작';
  }else if(selType==='construction'){
    const budget=document.querySelector('input[name="cBudget"]:checked')?.value||'';
    const fields=[...document.querySelectorAll('input[name="cField"]:checked')].map(x=>x.value);
    if(!budget){toast('공사 금액 구간을 선택해주세요.');return}
    if(!fields.length){toast('전문건설업 분야를 1개 이상 선택해주세요.');return}
    detail={budget,fields,location:document.getElementById('cLoc')?.value||'',work:document.getElementById('cWork')?.value||''};
    title=(fields[0]||'수선·공사')+(fields.length>1?` 외 ${fields.length-1}`:'');
  }else if(selType==='service'){
    const svcType=document.getElementById('svcType')?.value||'';
    if(!svcType){toast('용역 종류를 선택해주세요.');return}
    detail={svcType,scope:document.getElementById('svcScope')?.value||'',startDate:document.getElementById('svcStart')?.value||'',endDate:document.getElementById('svcEnd')?.value||'',content:document.getElementById('svcContent')?.value||''};
    title=svcType;
  }else{toast('주문 유형을 선택해주세요.');return}
  if(pendingPhotos.length)detail.photos=[...pendingPhotos];
  const n=Store.data.orders.length;
  const orderNo=`ORD-${new Date().getFullYear()}-${String(n+1).padStart(3,'0')}`;
  Store.data.orders.push({id:uid(),orderNo,clientId:CU.id,staffId:'u2',type:selType,status:'submitted',title,detail,desiredDate,deliveryAddr,note,taxInvoice:selTax,taxEmail,createdAt:today()});
  Store.save();selType='';selLoc='office';selTax='';pendingPhotos=[];
  toast('✅ 주문이 접수되었습니다!');go('orders');
}

function getCart(){return Store.data.cart[CU.id]||[]}
function getCartCount(){return getCart().reduce((s,i)=>s+i.qty,0)}
function getCartQty(pid){return(getCart().find(i=>i.pid===pid)||{qty:0}).qty}
function getCartTotal(){return getCart().reduce((s,i)=>{const p=Store.data.catalog.find(x=>x.id===i.pid);return s+(p?p.price*i.qty:0)},0)}

function addCart(pid){
  const cart=getCart();const ex=cart.find(i=>i.pid===pid);
  if(ex)ex.qty++;else cart.push({pid,qty:1});
  Store.data.cart[CU.id]=cart;Store.save();render();
}
function adjustCart(pid,d){
  let cart=getCart();const ex=cart.find(i=>i.pid===pid);
  if(ex){ex.qty+=d;if(ex.qty<=0)cart=cart.filter(i=>i.pid!==pid);}
  Store.data.cart[CU.id]=cart;Store.save();render();
}

  <table><thead><tr><th>품목명</th><th>규격</th><th>수량</th><th>단위</th>${q?'<th style="text-align:right">단가</th><th style="text-align:right">금액</th>':''}</tr></thead>
  <tbody>${q?q.items.map(it=>`<tr><td>${esc(it.name)}</td><td>${esc(it.spec||'')}</td><td>${comma(it.qty)}</td><td>${esc(it.unit||'')}</td><td style="text-align:right">${comma(it.unitPrice)}</td><td style="text-align:right">${comma(it.amount)}</td></tr>`).join(''):`<tr><td colspan="4">${esc(o.title)}</td></tr>`}</tbody></table>
  ${q?`<div style="text-align:right;font-size:16px;font-weight:900;color:#07182f;border-top:2px solid #07182f;padding-top:8px;margin-top:8px">합 계: ${comma(quoteTotal(q))}원</div>`:''}
  <div class="sigs">
    <div class="sbox"><div style="font-size:11px;color:#888;margin-bottom:18px">납품 확인자 (인)</div>${cl?.dept||''} ${cl?.name||''}</div>
    <div class="sbox"><div style="font-size:11px;color:#888;margin-bottom:18px">납품자 (인)</div>${s.bizName}</div>
  </div>
  <script>window.onload=()=>window.print()<\/script></body></html>`);
  w.document.close();
}

// ── PIN 변경 (로그인 후) ────────────────────────────────────
function changePin(){
  if(CU.pinHash){
    const cur=prompt('현재 비밀번호 4자리를 입력하세요:');
    if(cur===null)return;
    if(hashPin(cur,CU.id)!==CU.pinHash){toast('⚠️ 현재 비밀번호가 올바르지 않습니다.');return}
  }
  const np=prompt('새 비밀번호 4자리를 입력하세요:');
  if(np===null)return;
  if(!/^\d{4}$/.test(np)){toast('4자리 숫자만 입력해주세요.');return}
  const np2=prompt('새 비밀번호를 한 번 더 입력하세요:');
  if(np!==np2){toast('새 비밀번호가 일치하지 않습니다.');return}
  CU.pinHash=hashPin(np,CU.id);
  const idx=Store.data.users.findIndex(u=>u.id===CU.id);
  if(idx>=0)Store.data.users[idx]=CU;
  Store.save();toast('✅ 비밀번호가 변경되었습니다.');
}

// ── Favorites ──────────────────────────────────────────────
function toggleFav(orderId){
  if(!Store.data.favorites)Store.data.favorites=[];
  const idx=Store.data.favorites.indexOf(orderId);
  if(idx>=0){Store.data.favorites.splice(idx,1);toast('즐겨찾기에서 제거되었습니다.');}
  else{Store.data.favorites.push(orderId);toast('❤️ 즐겨찾기에 추가되었습니다.');}
  Store.save();render();
}

// ── Reorder ────────────────────────────────────────────────
function reorder(orderId){
  const o=Store.data.orders.find(x=>x.id===orderId);
  if(!o)return;
  if(!confirm(`"${esc(o.title)}"\n동일한 내용으로 재주문하시겠습니까?`))return;
  const n=Store.data.orders.length;
  const newO={...o,id:uid(),orderNo:`ORD-${new Date().getFullYear()}-${String(n+1).padStart(3,'0')}`,status:'submitted',createdAt:today(),desiredDate:today()};
  Store.data.orders.push(newO);Store.save();
  toast('✅ 재주문이 접수되었습니다!');go('orders');
}

// ── Ratings ────────────────────────────────────────────────
let _selStar=0;
function getRatingHTML(orderId){
  const rating=(Store.data.ratings||[]).find(r=>r.orderId===orderId);
  if(rating){
    const filled='⭐'.repeat(rating.stars);const empty='☆'.repeat(5-rating.stars);
    return `<div class="card-base p-5 mb-4">
      <div class="font-bold text-gray-700 mb-3">⭐ 납품 만족도 평가</div>
      <div class="flex items-center gap-3 mb-2">
        <span class="text-2xl">${filled}${empty}</span>
        <span class="font-extrabold text-xl" style="color:var(--gold)">${rating.stars}점</span>
      </div>
      ${rating.comment?`<p class="text-sm text-gray-600 bg-gray-50 rounded-xl p-3 mt-2">"${rating.comment}"</p>`:''}
      <div class="text-xs text-gray-400 mt-2">📅 ${fmt(rating.date)} 작성 · 업체 신뢰도 점수에 반영됩니다</div>
    </div>`;
  }
  return `<div class="card-base p-5 mb-4">
    <div class="font-bold text-gray-700 mb-2">⭐ 납품 만족도 평가</div>
    <p class="text-sm text-gray-500 mb-4">이 납품에 대한 만족도를 평가해 주세요. 평가 결과는 업체 신뢰도 지수에 반영되어 향후 계약 선정 참고자료로 활용됩니다.</p>
    <div id="starRow" class="flex gap-3 mb-4 justify-center">
      ${[1,2,3,4,5].map(s=>`<button class="text-4xl leading-none transition-transform hover:scale-125" style="background:none;border:none;cursor:pointer" onmouseover="hlStars(${s})" onmouseout="rstStars()" onclick="selStar(${s},event)">☆</button>`).join('')}
    </div>
    <textarea class="input-base mb-3" id="ratingComment" rows="2" placeholder="한 줄 소감 (선택)  예: 납품이 빠르고 품질이 좋았습니다"></textarea>
    <button class="w-full py-2 font-bold rounded-xl text-white transition-all" id="ratingSubmitBtn" style="background:#d1d5db;cursor:not-allowed" onclick="submitRating('${orderId}')" disabled>별점을 선택해 주세요</button>
  </div>`;
}
function hlStars(n){const bs=document.querySelectorAll('#starRow button');bs.forEach((b,i)=>{b.textContent=i<n?'⭐':'☆'})}
function rstStars(){const bs=document.querySelectorAll('#starRow button');bs.forEach((b,i)=>{b.textContent=i<_selStar?'⭐':'☆'})}
function selStar(n,e){
  _selStar=n;hlStars(n);
  const btn=document.getElementById('ratingSubmitBtn');
  if(btn){btn.disabled=false;btn.textContent=`${n}점으로 평가 제출하기`;btn.style.background='linear-gradient(135deg,#f59e0b,#d97706)';btn.style.cursor='pointer';}
}
function submitRating(orderId){
  if(!_selStar){toast('별점을 선택해 주세요.');return}
  const comment=document.getElementById('ratingComment')?.value.trim()||'';
  const stars=_selStar;
  if(!Store.data.ratings)Store.data.ratings=[];
  Store.data.ratings.push({id:uid(),orderId,userId:CU.id,stars,comment,date:today()});
  Store.save();_selStar=0;
  toast(`⭐ ${stars}점 평가가 등록되었습니다! 감사합니다.`);render();
}

// ── Toast & bind ───────────────────────────────────────────
function toast(msg){
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  document.body.appendChild(t);setTimeout(()=>t.remove(),3000);
}
function bind(){
  const ma=document.getElementById('msgArea');if(ma)ma.scrollTop=ma.scrollHeight;
}

// ── Init ───────────────────────────────────────────────────
Store.load();
document.title=`${Store.data.regionConfig.govName} 전용 주문관리 사이트`;
render();
</script>
</body>
</html>
