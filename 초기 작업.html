let CU=null, PAGE='login', PARAMS={};
function go(page,params={}){PAGE=page;PARAMS=params;render();}
function logout(){CU=null;go('login');}

// ═══════════════════════════════════════════════════════
//  메인 렌더
// ═══════════════════════════════════════════════════════
function render(){
  const app=document.getElementById('app');
  if(!CU){app.innerHTML=loginHTML();return;}
  const isStaff=CU.role==='admin'||CU.role==='staff';
  let body='';
  switch(PAGE){
    case 'dashboard': body=isStaff?adminDash():clientDash(); break;
    case 'orders':    body=isStaff?adminOrders():clientOrders(); break;
    case 'order-new': body=newOrderHTML(); break;
    case 'order-detail': body=isStaff?adminDetail(PARAMS.id):clientDetail(PARAMS.id); break;
    case 'quote-builder': body=quoteBuilder(PARAMS.orderId); break;
    case 'settings':  body=settingsHTML(); break;
    case 'docs':      body=docsHTML(); break;
    case 'mall':      body=mallHTML(); break;
    case 'catalog':   body=catalogHTML(); break;
    case 'cart':      body=cartHTML(); break;
    case 'admin-catalog': body=adminCatalogHTML(); break;
    default: body=isStaff?adminDash():clientDash();
  }
  app.innerHTML=`<div class="min-h-screen flex flex-col">${navHTML()}<main class="flex-1 max-w-6xl mx-auto w-full px-4 py-6"><div class="fade-in">${body}</div></main></div>${lunchModalHTML()}`;
}

// ═══════════════════════════════════════════════════════
//  네비
// ═══════════════════════════════════════════════════════
function navHTML(){
  const isStaff=CU.role==='admin'||CU.role==='staff';
  const items=isStaff
    ?[['dashboard','대시보드'],['orders','주문관리'],['admin-catalog','🛒 카탈로그'],['docs','📂 제출서류'],['settings','설정']]
    :[['dashboard','대시보드'],['orders','내 주문'],['catalog','🛒 조달몰'],['docs','📂 제출서류'],['mall','🎁 마일리지몰'],['order-new','+ 새 주문']];
  const roleLabel=CU.role==='admin'?'관리자':CU.role==='staff'?'담당자':'고객';
  return `
  <nav class="nav-glass text-white no-print sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 flex items-center justify-between h-14">
      <div class="flex items-center gap-3 sm:gap-6">
        <button onclick="go('dashboard')" class="font-extrabold text-base tracking-tight flex items-center gap-2" style="letter-spacing:-0.02em;">
          <span class="w-7 h-7 bg-white bg-opacity-15 rounded-lg flex items-center justify-center text-sm flex-shrink-0">📋</span>
          <span class="hidden sm:block text-sm">주문·납품 관리</span>
        </button>
        <div class="flex items-center gap-0.5">
          ${items.map(([p,l])=>`<button onclick="go('${p}')" class="px-2.5 py-1.5 rounded-xl text-xs sm:text-sm font-semibold transition-all ${PAGE===p?'bg-white bg-opacity-20 text-white':'text-blue-200 hover:bg-white hover:bg-opacity-10 hover:text-white'}">${l}</button>`).join('')}
        </div>
      </div>
      <div class="flex items-center gap-2">
        <div class="hidden md:block text-right">
          <p class="text-xs text-blue-200 font-medium" style="opacity:.8;">${CU.org}</p>
          <p class="text-xs text-white font-bold">${CU.name} <span class="ml-1 text-blue-300 font-medium">${roleLabel}</span></p>
        </div>
        <button onclick="logout()" class="text-xs text-blue-300 hover:text-white border border-blue-600 hover:border-blue-400 px-2.5 py-1.5 rounded-lg transition-all font-semibold whitespace-nowrap">로그아웃</button>

// ─── 부서 목록 렌더·선택 헬퍼 ───
function renderDeptList(list){
  if(!list.length) return `<div class="flex items-center justify-center h-full text-slate-400 text-sm">검색 결과가 없습니다.</div>`;
  const groups={};
  list.forEach(d=>{if(!groups[d.group])groups[d.group]=[];groups[d.group].push(d.name);});
  return Object.entries(groups).map(([grp,items])=>`
    <div>
      <div class="sticky top-0 px-4 py-1.5 border-b border-t" style="background:#F8FAFF; border-color:#EEF2FF;">
        <span class="text-[10px] font-extrabold uppercase tracking-widest" style="color:#6B7FD4;">${grp}</span>
      </div>
      ${items.map(name=>`
        <button onclick="selectDept('${name}')"
          class="dept-item w-full text-left px-4 py-2.5 text-sm font-medium text-slate-600 hover:bg-blue-50 hover:text-blue-700 border-b border-slate-50 last:border-0 transition-colors flex items-center justify-between"
          data-dept="${name}">
          <span>${name}</span>
          <span class="dept-check hidden text-blue-500 font-bold text-base">✓</span>
        </button>`).join('')}
    </div>`).join('');
}

function filterDepts(q){
  const filtered=q.trim()===''?ALL_DEPTS:ALL_DEPTS.filter(d=>d.name.includes(q.trim()));
  document.getElementById('deptList').innerHTML=renderDeptList(filtered);
  if(selectedDept) highlightDept(selectedDept);
}

function selectDept(name){
  selectedDept=name;
  document.querySelectorAll('.dept-item').forEach(el=>{
    const sel=el.dataset.dept===name;
    el.classList.toggle('bg-blue-50',sel);
    el.classList.toggle('text-blue-700',sel);
    el.classList.toggle('font-bold',sel);
    el.querySelector('.dept-check')?.classList.toggle('hidden',!sel);
  });
  const badge=document.getElementById('selectedBadge');
  badge.classList.remove('hidden'); badge.classList.add('flex');
  document.getElementById('selectedDeptName').textContent=name;
}

function highlightDept(name){
  const btn=document.querySelector(`.dept-item[data-dept="${name}"]`);
  if(btn){
    btn.classList.add('bg-blue-50','text-blue-700','font-bold');
    btn.querySelector('.dept-check')?.classList.remove('hidden');
    btn.scrollIntoView({block:'nearest',behavior:'smooth'});
  }
}

function clearDept(){
  selectedDept='';
  document.querySelectorAll('.dept-item').forEach(el=>{
    el.classList.remove('bg-blue-50','text-blue-700','font-bold');
    el.querySelector('.dept-check')?.classList.add('hidden');
  });
  const badge=document.getElementById('selectedBadge');
  badge.classList.add('hidden'); badge.classList.remove('flex');
}
// ─── end 부서 헬퍼 ───

function doLogin(){
  const name = document.getElementById('lName')?.value.trim();
  const errEl = document.getElementById('lErr');
  if(!selectedDept){
    errEl.textContent='부서를 선택해 주세요.'; errEl.classList.remove('hidden'); return;
  }
  if(!name){
    errEl.textContent='담당자 이름을 입력해 주세요.'; errEl.classList.remove('hidden'); return;
  }
  errEl.classList.add('hidden');
  // 기존 사용자 확인 or 자동 생성
  let u = Store.data.users.find(x=>x.role==='client'&&x.dept===selectedDept&&x.name===name);
  if(!u){
    u={id:uid(),email:'',pw:'',role:'client',name,org:'제천시청',dept:selectedDept,phone:'',addr:'충청북도 제천시',isActive:true};
    Store.data.users.push(u); Store.save();
  }
  CU=u; go('dashboard');
}

function doAdminLogin(){
  const e=document.getElementById('aEmail').value.trim();
  const p=document.getElementById('aPw').value;
  const u=Store.data.users.find(x=>x.email===e&&x.pw===p&&x.isActive&&(x.role==='admin'||x.role==='staff'));
  if(u){CU=u;hideAdminLogin();go('dashboard');}
  else document.getElementById('aErr').classList.remove('hidden');
}

function demoLogin(email){
  const u=Store.data.users.find(x=>x.email===email);
  if(u){CU=u;go('dashboard');}
}

function selectTypeCard(key,bg,bd,tx){
  // 모든 카드 초기화
  document.querySelectorAll('.type-card').forEach(el=>{
    el.style.background='';
    el.style.borderColor='';
    el.querySelector('.type-label-text')?.querySelectorAll('*').forEach(()=>{});
    const lbl=el.querySelector('.type-label-text');
    const desc=el.querySelector('.type-desc-text');
    const chk=el.querySelector('.type-check');
    if(lbl) lbl.style.color='';
    if(desc) desc.style.color='';
    if(chk) chk.classList.add('hidden');
  });
  // 선택한 카드 스타일 적용
  const sel=document.querySelector(`.type-card[data-type="${key}"]`);
  if(sel){
    sel.style.background=bg;
    sel.style.borderColor=bd;
    const lbl=sel.querySelector('.type-label-text');
    const desc=sel.querySelector('.type-desc-text');
    const chk=sel.querySelector('.type-check');
    if(lbl){lbl.style.color=tx;}
    if(desc){desc.style.color=bd; desc.style.opacity='.8';}
    if(chk){chk.classList.remove('hidden'); chk.style.color=bd;}
  }
  // 라디오 값 설정
  const radio=document.querySelector(`input[name="oType"][value="${key}"]`);
  if(radio) radio.checked=true;
  // typeFields 렌더
  const evt=new Event('change',{bubbles:true});
  radio?.dispatchEvent(evt);
}

function previewFiles(files){
  const container=document.getElementById('filePreview');
  if(!container||!files?.length) return;
  const arr=Array.from(files).slice(0,5);
  container.innerHTML='';
  arr.forEach(file=>{
    const wrap=document.createElement('div');
    wrap.className='relative border border-slate-200 rounded-xl overflow-hidden bg-slate-50';
    if(file.type.startsWith('image/')){
      const reader=new FileReader();
      reader.onload=e=>{
        wrap.innerHTML=`<img src="${e.target.result}" class="w-full h-20 object-cover"><div class="px-1.5 py-1 text-[10px] text-slate-500 truncate">${file.name}</div>`;
      };
      reader.readAsDataURL(file);
    } else {
      wrap.innerHTML=`<div class="h-20 flex items-center justify-center text-3xl">📄</div><div class="px-1.5 py-1 text-[10px] text-slate-500 truncate">${file.name}</div>`;
    }
    container.appendChild(wrap);
  });
  if(files.length>5){
    const more=document.createElement('div');
    more.className='flex items-center justify-center text-xs text-slate-400 font-semibold h-full';
    more.textContent=`+${files.length-5}개`;
    container.appendChild(more);
  }
}

  }

    const kind=document.getElementById('tf_kind')?.value;

    detail.spec=document.getElementById('tf_spec')?.value;
    detail.qty=document.getElementById('tf_qty')?.value;

    const fi=document.getElementById('tf_adv_files');
    detail.fileNames=fi?.files?.length?Array.from(fi.files).map(f=>f.name):[];

  else if(type==='construction'){

    const fi=document.getElementById('tf_con_files');

    detail.endDate=document.getElementById('tf_svcEnd')?.value;
    detail.desc=document.getElementById('tf_svcDesc')?.value;
  }
  else if(type==='toner'){
    detail.items=Array.from(document.querySelectorAll('.toner-row')).map(r=>({
      model:r.querySelector('.tn-model')?.value||'',
      partNo:r.querySelector('.tn-partno')?.value||'',
      color:r.querySelector('.tn-color')?.value||'흑백',
      qty:r.querySelector('.tn-qty')?.value||'1',
      unit:r.querySelector('.tn-unit')?.value||'개'
    })).filter(x=>x.model||x.partNo);
  }
  else{detail.items=Array.from(document.querySelectorAll('.sup-row')).map(r=>({name:r.querySelector('.sup-name')?.value,spec:r.querySelector('.sup-spec')?.value,qty:r.querySelector('.sup-qty')?.value,unit:r.querySelector('.sup-unit')?.value})).filter(x=>x.name);}

  const o={id:uid(),orderNo:`ORD-2026-${String(seq).padStart(3,'0')}`,clientId:CU.id,staffId:null,type,status:'submitted',title,detail,desiredDate:document.getElementById('nDate')?.value,deliveryAddr:getAddr(),note:document.getElementById('nNote')?.value,taxInvoice,taxEmail,createdAt:today()};

function advanceStatus(id){
  const o=Store.data.orders.find(x=>x.id===id);
  if(o&&STATUS_NEXT[o.status]){o.status=STATUS_NEXT[o.status];Store.save();go('order-detail',{id});}
}
function cancelOrder(id){
  if(!confirm('이 주문을 취소하시겠습니까?')) return;
  const o=Store.data.orders.find(x=>x.id===id);
  if(o){o.status='cancelled';Store.save();go('orders');}
}
function approveQuote(qId){
  const q=Store.data.quotes.find(x=>x.id===qId);
  if(q){
    q.status='approved';
    const o=Store.data.orders.find(x=>x.id===q.orderId);
    if(o){
      o.status='quote_approved';
      const pts=earnMileage(o.clientId, q.totalAmt, `${o.orderNo} 견적 승인 (${q.totalAmt.toLocaleString()}원의 1%)`);
      if(pts) setTimeout(()=>alert(`🎉 마일리지 ${pts.toLocaleString()}P 적립!\n현재 잔액: ${getMileage(o.clientId).balance.toLocaleString()}P`),100);
    }
    Store.save(); go('order-detail',{id:q.orderId});
  }
}

//  메시지 스레드
// ═══════════════════════════════════════════════════════
function msgThread(orderId, msgs){
  return card(`
    <div class="px-5 py-4 border-b border-slate-100"><h3 class="font-bold text-slate-700 text-sm">메시지</h3></div>
    <div class="p-5">
      <div class="space-y-3 mb-4 max-h-60 overflow-y-auto pr-1" id="msgArea">
        ${msgs.length===0?`<div class="text-center py-6 text-slate-400 text-sm">💬 메시지가 없습니다.</div>`:''}
        ${msgs.map(m=>{
          const s=Store.data.users.find(u=>u.id===m.senderId);
          const mine=m.senderId===CU.id;
          return `<div class="flex ${mine?'justify-end':'justify-start'}">
            <div class="max-w-[75%]">
              ${!mine?`<p class="text-xs text-slate-400 mb-1 font-semibold">${s?.name||'?'} (${s?.org||''})</p>`:''}
              <div class="text-sm px-4 py-2.5 rounded-2xl ${mine?'bg-[#1E3A8A] text-white rounded-tr-sm':'bg-slate-100 text-slate-800 rounded-tl-sm'}">${m.body}</div>
              <p class="text-[10px] text-slate-300 mt-1 ${mine?'text-right':''}">${m.createdAt?.replace('T',' ').slice(0,16)||''}</p>
            </div>
          </div>`;
        }).join('')}
      </div>
      <div class="flex gap-2">
        <input id="msgIn" type="text" placeholder="메시지를 입력하세요..." class="flex-1 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" onkeydown="if(event.key==='Enter')sendMsg('${orderId}')">
        <button onclick="sendMsg('${orderId}')" class="bg-[#1E3A8A] hover:bg-blue-900 text-white px-5 py-2.5 rounded-xl text-sm font-bold transition-colors">전송</button>
      </div>
    </div>
  `);
}
function sendMsg(orderId){
  const el=document.getElementById('msgIn'); if(!el) return;
  const body=el.value.trim(); if(!body) return;
  Store.data.messages.push({id:uid(),orderId,senderId:CU.id,body,createdAt:new Date().toISOString()});
  Store.save(); el.value=''; go('order-detail',{id:orderId});
}

function addQtRow(){
  const c=document.getElementById('qItems'); if(!c) return;
  const r=document.createElement('div'); r.className='grid grid-cols-12 gap-2 q-row';
  r.innerHTML=`<input class="qi-n col-span-4 border border-slate-200 rounded-lg px-2 py-2 text-sm focus:outline-none" placeholder="품목명">
    <input class="qi-s col-span-2 border border-slate-200 rounded-lg px-2 py-2 text-sm focus:outline-none" placeholder="규격">
    <input class="qi-q col-span-1 border border-slate-200 rounded-lg px-2 py-2 text-sm text-right focus:outline-none" type="number" value="1" oninput="calcQt()">
    <input class="qi-p col-span-2 border border-slate-200 rounded-lg px-2 py-2 text-sm text-right focus:outline-none" type="number" value="0" oninput="calcQt()">
    <div class="qi-a col-span-2 flex items-center justify-end text-sm font-semibold text-slate-700 pr-1">0</div>
    <button onclick="rmQtRow(this)" class="col-span-1 text-slate-300 hover:text-red-400 text-xl font-bold">×</button>`;
  c.appendChild(r);
}
function rmQtRow(btn){
  const rows=document.querySelectorAll('.q-row'); if(rows.length<=1) return;
  btn.closest('.q-row').remove(); calcQt();
}
function calcQt(){
  let sup=0;
  document.querySelectorAll('.q-row').forEach(r=>{
    const q=parseFloat(r.querySelector('.qi-q')?.value)||0;
    const p=parseFloat(r.querySelector('.qi-p')?.value)||0;
    const a=q*p; const el=r.querySelector('.qi-a');
    if(el) el.textContent=a.toLocaleString(); sup+=a;
  });
  const vat=Math.round(sup*0.1);
  document.getElementById('qS').textContent=sup.toLocaleString()+'원';
  document.getElementById('qV').textContent=vat.toLocaleString()+'원';
  document.getElementById('qT').textContent=(sup+vat).toLocaleString()+'원';
}
function saveQuote(orderId){
  const items=[];
  document.querySelectorAll('.q-row').forEach(r=>{
    const name=r.querySelector('.qi-n')?.value.trim(); if(!name) return;
    const qty=parseFloat(r.querySelector('.qi-q')?.value)||0;
    const unitPrice=parseFloat(r.querySelector('.qi-p')?.value)||0;
    items.push({name,spec:r.querySelector('.qi-s')?.value||'',qty,unitPrice,amount:qty*unitPrice});
  });
  if(!items.length){alert('견적 항목을 입력해 주세요.');return;}
  const supplyAmt=items.reduce((s,i)=>s+i.amount,0);
  const vatAmt=Math.round(supplyAmt*0.1);
  const seq=Store.data.quotes.length+1;
  Store.data.quotes.push({id:uid(),quoteNo:`Q-2026-${String(seq).padStart(3,'0')}`,orderId,items,supplyAmt,vatAmt,totalAmt:supplyAmt+vatAmt,validUntil:document.getElementById('qValid')?.value,note:document.getElementById('qNote')?.value,status:'sent',createdBy:CU.id,createdAt:today()});
  const o=Store.data.orders.find(x=>x.id===orderId);
  if(o){o.status='quoted';o.staffId=CU.id;}
  Store.save(); go('order-detail',{id:orderId});
}

function uploadDoc(id,name,input){
  if(!input.files?.length) return;
  const file=input.files[0];
  const reader=new FileReader();
  reader.onload=e=>{
    if(!Store.data.docs) Store.data.docs=[];
    Store.data.docs=Store.data.docs.filter(d=>d.id!==id);
    Store.data.docs.push({id,name,data:e.target.result,fileName:file.name,uploadedAt:today()});
    Store.save();
    go('docs');
  };
  reader.readAsDataURL(file);
}

function downloadDoc(id){
  const doc=Store.data.docs?.find(d=>d.id===id);
  if(!doc) return;
  const a=document.createElement('a');
  a.href=doc.data;
  a.download=doc.fileName||doc.name;
  a.click();
}

//  조달몰 — 카탈로그 + 장바구니
// ═══════════════════════════════════════════════════════
const CAT_LIST = ['전체','사무용품','토너·소모품','청소·위생','현수막·광고물','수선·공사','용역'];
const CAT_ICON = {'사무용품':'🖊️','토너·소모품':'🖨️','청소·위생':'🧹','현수막·광고물':'🪧','수선·공사':'🔧','용역':'🤝','전체':'📦'};
const CONTRACT_GUIDE = [
  {max:1000000,   label:'즉시 구매 가능',     color:'#1b8f5a', bg:'#ecfdf5'},
  {max:5000000,   label:'수의 1인 견적',       color:'#1d5fa8', bg:'#eff6ff'},
  {max:20000000,  label:'수의 2인 이상 견적',  color:'#d97706', bg:'#fff7ed'},
  {max:Infinity,  label:'경쟁입찰 필요',        color:'#c53030', bg:'#fff0f0'},
];
let _catFilter = '전체';

function getContract(total){
  return CONTRACT_GUIDE.find(g=>total<=g.max);
}

// ─── 장바구니 헬퍼 ───
function getCart(){
  if(!Store.data.cart) Store.data.cart={};
  if(!Store.data.cart[CU.id]) Store.data.cart[CU.id]=[];
  return Store.data.cart[CU.id];
}
function cartTotal(){
  return getCart().reduce((s,item)=>{
    const p=Store.data.catalog.find(c=>c.id===item.pid);
    return s+(p?p.price*item.qty:0);
  },0);
}
function cartCount(){
  return getCart().reduce((s,i)=>s+i.qty,0);
}
function addToCart(pid){
  const cart=getCart();
  const ex=cart.find(i=>i.pid===pid);
  if(ex) ex.qty+=1; else cart.push({pid,qty:1});
  Store.save();
  // 토스트
  const el=document.getElementById('cartToast');
  if(el){el.classList.remove('opacity-0');setTimeout(()=>el.classList.add('opacity-0'),1500);}
  // 네비 배지 갱신
  const badge=document.getElementById('cartBadge');
  if(badge) badge.textContent=cartCount();
}
function removeFromCart(pid){
  Store.data.cart[CU.id]=(Store.data.cart[CU.id]||[]).filter(i=>i.pid!==pid);
  Store.save(); go('cart');
}
function changeQty(pid,delta){
  const cart=getCart();
  const item=cart.find(i=>i.pid===pid);
  if(!item) return;
  item.qty=Math.max(1,item.qty+delta);
  Store.save(); go('cart');
}

  return `
  <div>
    <!-- 헤더 -->
    <div class="flex items-start justify-between mb-5 gap-3">
      <div>
        <h2 class="text-2xl font-extrabold" style="color:#0b2547;letter-spacing:-0.03em;">🛒 조달몰</h2>
        <p class="text-sm mt-0.5" style="color:#94a3b8;">자주 구매하는 물품을 카탈로그에서 바로 주문하세요.</p>
      </div>
      <button onclick="go('cart')" class="relative flex items-center gap-2 px-4 py-2.5 rounded-xl font-bold text-sm transition-all flex-shrink-0"
        style="background:linear-gradient(135deg,#07182f,#1d5fa8);color:#fff;box-shadow:0 4px 14px rgba(7,24,47,.22);">
        🛒 장바구니
        ${cnt>0?`<span id="cartBadge" class="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full text-xs font-extrabold flex items-center justify-center"
          style="background:#ef4444;color:#fff;">${cnt}</span>`:'<span id="cartBadge" class="hidden"></span>'}
      </button>
    </div>

    <!-- 카테고리 탭 -->
    <div class="flex gap-2 mb-5 overflow-x-auto pb-1">
      ${CAT_LIST.map(c=>`
        <button onclick="setCatFilter('${c}')"
          class="px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap flex-shrink-0 transition-all flex items-center gap-1.5"
          style="${_catFilter===c
            ? 'background:linear-gradient(135deg,#07182f,#1d5fa8);color:#fff;box-shadow:0 4px 12px rgba(7,24,47,.22);'
            : 'background:rgba(255,255,255,.9);color:#475569;border:1.5px solid #d7e3f4;'}">
          ${CAT_ICON[c]||'📦'} ${c}
        </button>`).join('')}
    </div>

    <!-- 상품 그리드 -->
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-4">
      ${active.length===0?`<div class="col-span-3 py-16 text-center" style="color:#94a3b8;">등록된 상품이 없습니다.</div>`
      :active.map(p=>`
        <div class="card-base flex flex-col overflow-hidden">
          <div class="flex items-center justify-center py-7 text-4xl" style="background:${
  p.cat==='수선·공사'?'linear-gradient(135deg,#fff7ed,#ffedd5)':
  p.cat==='용역'?'linear-gradient(135deg,#f0fdf4,#dcfce7)':
  p.cat==='현수막·광고물'?'linear-gradient(135deg,#fdf4ff,#f3e8ff)':
  'linear-gradient(135deg,#f8faff,#eef4ff)'};">${p.icon}</div>
          <div class="p-4 flex flex-col flex-1">
            <p class="text-xs font-bold mb-1 px-2 py-0.5 rounded-full self-start" style="background:#eef4ff;color:#1d5fa8;">${p.cat}</p>
            <p class="text-sm font-extrabold mt-1.5 leading-snug" style="color:#0b2547;">${p.name}</p>
            <p class="text-xs mt-1 mb-3 flex-1" style="color:#94a3b8;line-height:1.6;">${p.spec}<br>${p.desc}</p>
            <div class="flex items-center justify-between border-t pt-3" style="border-color:#eef4ff;">
              <div>
                ${p.price>0
                  ?`<p class="text-base font-extrabold" style="color:#0b2547;letter-spacing:-0.02em;">${p.price.toLocaleString()}<span class="text-xs ml-0.5" style="color:#94a3b8;">원/${p.unit}</span></p>`
                  :`<p class="text-sm font-bold" style="color:#d97706;">견적 별도</p>`}
              </div>
              <button onclick="addToCart('${p.id}')"
                class="text-xs font-bold px-3 py-2 rounded-xl transition-all"
                style="background:linear-gradient(135deg,#07182f,#1d5fa8);color:#fff;box-shadow:0 3px 10px rgba(7,24,47,.2);">
                + 담기
              </button>
            </div>
          </div>
        </div>`).join('')}
    </div>

    <!-- 담기 토스트 -->
    <div id="cartToast" class="opacity-0 fixed bottom-6 left-1/2 -translate-x-1/2 px-5 py-3 rounded-2xl font-bold text-sm text-white transition-opacity duration-300 z-50"
      style="background:linear-gradient(135deg,#07182f,#1d5fa8);box-shadow:0 8px 24px rgba(7,24,47,.3);">
      ✅ 장바구니에 추가되었습니다
    </div>
  </div>`;
}

function setCatFilter(cat){ _catFilter=cat; go('catalog'); }

// ─── 장바구니 페이지 ───
function cartHTML(){
  const cart=getCart();
  const items=cart.map(i=>({...i,product:Store.data.catalog.find(p=>p.id===i.pid)})).filter(i=>i.product);
  const total=cartTotal();
  const guide=getContract(total);
  return `

        class="text-xs font-semibold" style="color:#94a3b8;">전체 삭제</button>`:''}
    </div>

    ${items.length===0
      ?`${card(`<div class="py-16 text-center"><p class="text-3xl mb-3">🛒</p>

          <button onclick="go('catalog')" class="btn-primary px-6 py-3 text-sm text-white font-bold rounded-xl">카탈로그 보러가기</button></div>`)}`
      :`
      <!-- 장바구니 품목 -->
      ${card(`
        <div class="px-5 py-4 border-b font-bold text-sm" style="border-color:#eef4ff;color:#0b2547;">주문 품목 (${items.length}종 ${cartCount()}개)</div>
        <div class="divide-y" style="border-color:#eef4ff;">
          ${items.map(i=>`
            <div class="px-5 py-4 flex items-center gap-3">
              <span class="text-2xl flex-shrink-0">${i.product.icon}</span>
              <div class="flex-1 min-w-0">
                <p class="text-sm font-bold truncate" style="color:#0b2547;">${i.product.name}</p>
                <p class="text-xs mt-0.5" style="color:#94a3b8;">${i.product.spec}</p>
                ${i.product.price>0
                  ?`<p class="text-sm font-extrabold mt-1" style="color:#1d5fa8;">${(i.product.price*i.qty).toLocaleString()}원</p>`
                  :`<p class="text-sm font-bold mt-1" style="color:#d97706;">견적 별도</p>`}
              </div>
              <div class="flex items-center gap-1.5 flex-shrink-0">
                <button onclick="changeQty('${i.pid}',-1)" class="w-7 h-7 rounded-lg text-sm font-bold flex items-center justify-center" style="background:#eef4ff;color:#1d5fa8;">−</button>

function submitCartOrder(){
  const cart=getCart();
  if(!cart.length){alert('장바구니가 비어있습니다.');return;}
  const addr=document.getElementById('cartAddr')?.value||'';
  const note=document.getElementById('cartNote')?.value||'';
  const items=cart.map(i=>{
    const p=Store.data.catalog.find(c=>c.id===i.pid);
    return {name:p?.name,spec:p?.spec,qty:i.qty,unit:p?.unit,price:p?.price||0};
  }).filter(i=>i.name);
  const total=cartTotal();
  const cats=new Set(items.map(i=>Store.data.catalog.find(c=>c.id===i.pid)?.cat).filter(Boolean));
  const orderType=cats.has('수선·공사')?'construction':cats.has('용역')?'service':'supplies';
  const titleItems=items.slice(0,2).map(i=>i.name).join(', ')+(items.length>2?` 외 ${items.length-2}종`:'');
  const seq=Store.data.orders.length+1;
  const order={
    id:uid(),orderNo:`ORD-2026-${String(seq).padStart(3,'0')}`,
    clientId:CU.id,staffId:null,type:orderType,status:'submitted',
    title:`[조달몰] ${titleItems}`,
    detail:{items,source:'catalog',cartTotal:total},
    desiredDate:'',deliveryAddr:addr,note,taxInvoice:'delivery',taxEmail:'',
    createdAt:today()
  };
  Store.data.orders.push(order);
  Store.data.cart[CU.id]=[];
  Store.save();
  alert(`✅ 주문이 접수되었습니다!\n${order.orderNo}\n\n담당자가 견적서를 발송해 드립니다.`);
  go('order-detail',{id:order.id});
}

function showAddProduct(){ document.getElementById('addProductForm')?.classList.remove('hidden'); }

function saveProduct(){
  const name=document.getElementById('np_name')?.value.trim();
  if(!name){alert('상품명을 입력해 주세요.');return;}
  if(!Store.data.catalog) Store.data.catalog=[];
  Store.data.catalog.push({
    id:'c'+uid(), cat:document.getElementById('np_cat')?.value,
    name, spec:document.getElementById('np_spec')?.value||'',
    unit:document.getElementById('np_unit')?.value||'개',
    price:parseInt(document.getElementById('np_price')?.value)||0,
    icon:document.getElementById('np_icon')?.value||'📦',
    desc:document.getElementById('np_desc')?.value||'', active:true
  });
  Store.save(); go('admin-catalog');
}

function toggleProduct(id){
  const p=Store.data.catalog?.find(x=>x.id===id);
  if(p){p.active=!p.active;Store.save();go('admin-catalog');}
}
function deleteProduct(id){
  if(!confirm('이 상품을 삭제하시겠습니까?')) return;
  Store.data.catalog=(Store.data.catalog||[]).filter(x=>x.id!==id);
  Store.save(); go('admin-catalog');
}

const REEL_EMOJIS = ['🍖','🍜','🐟','🥩','🫕','🍱','🥗','🍝','🍗','🌿','🍲','🛒'];

let _lunchResults = [];

function openLunchModal(){
  const modal = document.getElementById('lunchModal');
  if(modal){ modal.classList.remove('hidden'); spinLunch(); }
}
function closeLunchModal(){
  const modal = document.getElementById('lunchModal');
  if(modal) modal.classList.add('hidden');
}

function spinLunch(){
  // 결과 숨기고 릴 돌리기
  const resultsEl = document.getElementById('lunchResults');
  const spinEl    = document.getElementById('lunchSpin');
  if(resultsEl) resultsEl.classList.add('hidden');
  if(spinEl)    spinEl.classList.remove('hidden');

  // 릴 애니메이션
  const reels = document.querySelectorAll('.reel-inner');
  reels.forEach((reel, ri) => {
    const items = [...REEL_EMOJIS, ...REEL_EMOJIS].map(e=>`<div class="reel-item">${e}</div>`).join('');
    reel.innerHTML = items;
    reel.style.transition = 'none';
    reel.style.transform = 'translateY(0)';
    setTimeout(()=>{
      reel.style.transition = `transform ${0.8 + ri*0.25}s cubic-bezier(.23,1,.32,1)`;
      const stop = -(REEL_EMOJIS.length * 2.8 * 10 + ri * 2.8 * 3);
      reel.style.transform = `translateY(${stop % (REEL_EMOJIS.length * 2.8 * 16)}rem)`;
    }, 50 + ri*80);
  });

  // 결과 선택 (랜덤 3개, 중복 없음)
  const shuffled = [...JECHEON_RESTAURANTS].sort(()=>Math.random()-.5);
  _lunchResults = shuffled.slice(0,3);

  setTimeout(()=>{
    if(spinEl) spinEl.classList.add('hidden');
    renderLunchResults();
    if(resultsEl) resultsEl.classList.remove('hidden');
  }, 1800);
}

function renderLunchResults(){
  const el = document.getElementById('lunchResults');
  if(!el) return;
  const colors = [
    {bg:'#fff7ed', bd:'#f97316', tx:'#c2410c', num:'#f97316'},
    {bg:'#eff6ff', bd:'#3b82f6', tx:'#1d4ed8', num:'#3b82f6'},
    {bg:'#f0fdf4', bd:'#22c55e', tx:'#15803d', num:'#22c55e'},
  ];
  el.innerHTML = _lunchResults.map((r,i)=>{
    const c = colors[i];
    return `
    <div class="lunch-card p-4 flex gap-3 items-start" style="border-color:${c.bd}; background:${c.bg};">
      <div class="w-10 h-10 rounded-2xl flex items-center justify-center text-xl flex-shrink-0"
        style="background:rgba(255,255,255,.8); border:1.5px solid ${c.bd};">

      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2 flex-wrap">
          <span class="text-xs font-extrabold rounded-full px-2 py-0.5" style="background:rgba(255,255,255,.8);color:${c.tx};border:1px solid ${c.bd};">${r.cat}</span>
          <span class="text-xs" style="color:#94a3b8;">🚶 도보 약 ${r.walk}분</span>
        </div>
        <p class="text-base font-extrabold mt-1" style="color:#07182f; letter-spacing:-0.02em;">${r.name}</p>

        <p class="text-xs mt-1.5 leading-relaxed" style="color:#475569;">${r.desc}</p>
      </div>
    </div>`;
  }).join('');
}

        <div class="text-3xl mb-2">🍽️</div>
        <p class="text-white font-extrabold text-lg" style="letter-spacing:-0.02em;">오늘 점심 뭐 먹지?</p>
        <p class="text-xs mt-1" style="color:rgba(186,230,253,.75);">제천 시내 맛집 랜덤 추천</p>
        <!-- 릴 -->
        <div id="lunchSpin" class="flex justify-center gap-3 my-4">
          ${[0,1,2].map(i=>`
          <div class="reel w-12 h-11 rounded-xl overflow-hidden" style="background:rgba(255,255,255,.12);">
            <div class="reel-inner"><div class="reel-item">🍖</div></div>
          </div>`).join('')}
        </div>
      </div>
      <!-- 결과 -->
      <div class="p-4 space-y-3" id="lunchResults"></div>
      <!-- 다시 -->
      <div class="px-5 pb-5">
        <button onclick="spinLunch()" class="w-full font-extrabold py-3.5 rounded-2xl text-white text-sm tracking-wide"
          style="background:linear-gradient(135deg,#07182f,#1d5fa8);box-shadow:0 8px 20px rgba(7,24,47,.25);">
          🎲 다시 뽑기
        </button>
      </div>
    </div>
  </div>`;
}

// ═══════════════════════════════════════════════════════
//  마일리지 헬퍼
// ═══════════════════════════════════════════════════════
function getMileage(userId){
  if(!Store.data.mileage) Store.data.mileage={};
  if(!Store.data.mileage[userId]) Store.data.mileage[userId]={balance:0,history:[]};
  return Store.data.mileage[userId];
}
function earnMileage(userId, amount, desc){
  const m=getMileage(userId);
  const pts=Math.floor(amount*MILEAGE_RATE);
  if(pts<=0) return;
  m.balance+=pts;
  m.history.unshift({date:today(),desc,pts,type:'earn'});
  Store.save();
  return pts;
}
function spendMileage(userId, pts, desc){
  const m=getMileage(userId);
  if(m.balance<pts) return false;
  m.balance-=pts;
  m.history.unshift({date:today(),desc,pts:-pts,type:'spend'});
  Store.save();
  return true;
}

Store.load();
render();
</script>
