<script>

const STATUS_LABELS={draft:'임시저장',submitted:'접수대기',quoted:'견적발송',quote_approved:'견적승인',in_progress:'작업중',proof_review:'시안확인',proof_approved:'시안승인',delivering:'납품중',completed:'완료',cancelled:'취소'};
const ORDER_TYPES={supplies:'사무용품',toner:'토너·소모품',banner:'현수막',advertising:'광고물',construction:'수선·공사',service:'용역'};

const uid=()=>Math.random().toString(36).substr(2,9);
const today=()=>new Date().toISOString().split('T')[0];
const fmt=d=>d?d.replace(/-/g,'.'):'—';
const comma=n=>Number(n||0).toLocaleString();
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function quoteTotal(q){return Number(q?.total??q?.totalAmt??0)}
function quoteSub(q){return Number(q?.subtotal??q?.supplyAmt??0)}
function quoteVat(q){return Number(q?.vat??q?.vatAmt??0)}
function msgText(m){return m.text??m.body??''}
function needsProof(type){return type==='banner'||type==='advertising'}
function nextStatusFor(o){
  if(!o)return null;
  if(o.status==='submitted'||o.status==='quoted')return null;
  if(o.status==='quote_approved')return 'in_progress';
  if(o.status==='in_progress')return needsProof(o.type)?'proof_review':'delivering';
  if(o.status==='proof_review')return 'proof_approved';
  if(o.status==='proof_approved')return 'delivering';
  if(o.status==='delivering')return 'completed';
  return null;
}
function orderDetailRows(o){
  const d=o.detail||{}, rows=[];
  const add=(k,v)=>{if(v===undefined||v===null||v===''||(Array.isArray(v)&&!v.length))return;rows.push(`<div><span class="text-gray-400 block">${esc(k)}</span><span class="font-semibold whitespace-pre-wrap">${esc(Array.isArray(v)?v.join(', '):String(v))}</span></div>`)};
  if(o.type==='supplies'&&Array.isArray(d.items)&&d.items.length){
    return `<div class="col-span-2 mt-2">${d.items.map(it=>`<div class="text-sm py-1 border-b border-gray-50">${esc(it.name)} <span class="text-gray-400">${esc(it.spec||'')} · ${comma(it.qty)} ${esc(it.unit||'')}</span></div>`).join('')}</div>`;
  }
  if(o.type==='toner'){add('제조사',d.maker);add('기종',d.model);add('토너번호',d.no);add('색상',d.color);add('수량',d.qty);}
  if(o.type==='banner'){add('종류',d.bannerKind);add('가로(cm)',d.width);add('세로(cm)',d.height);add('설치위치',d.location);add('수량',d.qty);add('홍보문구',d.text);add('시안회신',d.contact||d.replyPhone||d.replyEmail);}
  if(o.type==='advertising'){add('종류',d.kind||d.etcDesc);add('규격',d.spec);add('수량',d.qty);add('도수',d.dpi||d.color);add('시안회신',d.contact||d.replyPhone||d.replyEmail);}
  if(o.type==='construction'){add('금액구간',d.budget||d.conRange);add('분야',d.fields||d.conField);add('작업위치',d.location);add('작업내용',d.work||d.desc);}
  if(o.type==='service'){add('용역종류',d.svcType);add('범위',d.scope);add('기간',(d.startDate||d.endDate)?`${d.startDate||''} ~ ${d.endDate||''}`:'');add('내용',d.content||d.desc);}
  return rows.join('');
}

        {id:'ps_etc',name:'기타(문의)',spec:'직접 문의',price:0,unit:'건',icon:'💬'}
      ]}
    ];
    this.data.catalog=[];
    cats.forEach(c=>c.items.forEach(p=>this.data.catalog.push({...p,cat:c.cat,visible:true,desc:''})));
    this.save();
  }
};

function quotePage(orderId){

  const total=sub+vat;
  return `
  <div class="max-w-3xl">
    <div class="flex items-center gap-3 mb-5">
      <button class="btn-ghost text-xl" onclick="go('order-detail','${orderId}')">←</button>
      <div>
        <h2 class="text-xl font-extrabold text-gray-900">견적서 작성</h2>
        <div class="text-xs text-gray-400">${o.orderNo} · ${esc(cl?.dept||'')} ${esc(cl?.name||'')}</div>
      </div>
    </div>
    <div class="card-base p-5 mb-4">
      <div class="font-bold text-gray-700 mb-4">품목 입력</div>
      <div class="grid text-xs text-gray-500 font-semibold mb-2 px-1 gap-2" style="grid-template-columns:3fr 2fr 1fr 1fr 2fr 2fr auto">
        <span>품목명</span><span>규격</span><span>수량</span><span>단위</span><span>단가 (원)</span><span>금액 (원)</span><span></span>

          <input value="${it.name||''}" placeholder="품목명" oninput="calcQt()">
          <input value="${it.spec||''}" placeholder="규격">
          <input value="${it.qty||1}" type="number" min="1" oninput="calcQt()">
          <input value="${it.unit||'개'}" placeholder="단위">
          <input value="${it.unitPrice||0}" type="number" min="0" oninput="calcQt()">
          <input value="${it.amount||0}" type="number" readonly style="background:#f8f9fa;color:#555">
          <button class="btn-ghost text-red-400 text-lg px-2" onclick="this.closest('.qt-row').remove();calcQt()">✕</button>

    </div>
    <div class="card-base p-5 mb-4">
      <div class="flex justify-end">
        <div class="w-64 space-y-2 text-sm">
          <div class="flex justify-between"><span class="text-gray-500">공급가액</span><span id="qtSub" class="font-semibold">${comma(sub)}원</span></div>
          <div class="flex justify-between"><span class="text-gray-500">부가세 (10%)</span><span id="qtVat" class="font-semibold">${comma(vat)}원</span></div>
          <div class="flex justify-between text-lg font-extrabold text-blue-800 pt-2 border-t"><span>합 계</span><span id="qtTotal">${comma(total)}원</span></div>
        </div>
      </div>
      <div class="mt-4">
        <label class="text-xs font-semibold text-gray-500 block mb-1">비고</label>

      </div>
    </div>
    <div class="flex gap-3">
      <button class="btn-outline flex-1 py-3" onclick="go('order-detail','${orderId}')">취소</button>

    </div>
  </div>`;

function addQtRow(){
  const c=document.getElementById('qtRows');if(!c)return;
  const d=document.createElement('div');
  d.className='qt-row grid gap-2 mb-2';d.style.gridTemplateColumns='3fr 2fr 1fr 1fr 2fr 2fr auto';
  d.innerHTML='<input placeholder="품목명" oninput="calcQt()"><input placeholder="규격"><input value="1" type="number" min="1" oninput="calcQt()"><input value="개" placeholder="단위"><input value="0" type="number" min="0" oninput="calcQt()"><input value="0" type="number" readonly style="background:#f8f9fa;color:#555"><button class="btn-ghost text-red-400 text-lg px-2" onclick="this.closest(\'.qt-row\').remove();calcQt()">✕</button>';
  c.appendChild(d);
}

function calcQt(){
  const rows=document.querySelectorAll('.qt-row');
  let sub=0;
  rows.forEach(r=>{
    const ins=r.querySelectorAll('input');
    const qty=Number(ins[2]?.value||0);
    const price=Number(ins[4]?.value||0);
    const amt=qty*price;
    if(ins[5])ins[5].value=amt;
    sub+=amt;
  });
  const vat=Math.floor(sub*0.1);
  const tot=sub+vat;
  const s=document.getElementById('qtSub');const v=document.getElementById('qtVat');const t=document.getElementById('qtTotal');
  if(s)s.textContent=comma(sub)+'원';
  if(v)v.textContent=comma(vat)+'원';
  if(t)t.textContent=comma(tot)+'원';
}

function saveQuote(orderId){
  const rows=document.querySelectorAll('.qt-row');
  const items=[];
  rows.forEach(r=>{
    const ins=r.querySelectorAll('input');
    if(ins[0]?.value){
      const qty=Number(ins[2]?.value||1);
      const unitPrice=Number(ins[4]?.value||0);
      items.push({name:ins[0].value,spec:ins[1]?.value||'',qty,unit:ins[3]?.value||'개',unitPrice,amount:qty*unitPrice});
    }
  });
  if(!items.length){toast('품목을 1개 이상 입력하세요.');return}
  const sub=items.reduce((s,i)=>s+i.amount,0);
  const vat=Math.floor(sub*0.1);
  const total=sub+vat;
  const note=document.getElementById('qtNote')?.value||'';
  const existing=Store.data.quotes.find(x=>x.orderId===orderId);
  if(existing){Object.assign(existing,{items,subtotal:sub,supplyAmt:sub,vat,vatAmt:vat,total,totalAmt:total,note,updatedAt:today()});}
  else{Store.data.quotes.push({id:uid(),orderId,items,subtotal:sub,supplyAmt:sub,vat,vatAmt:vat,total,totalAmt:total,note,createdAt:today()});}
  const o=Store.data.orders.find(x=>x.id===orderId);
  if(o&&o.status==='submitted')o.status='quoted';
  Store.save();
  toast('✅ 견적서가 저장되었습니다.');
  go('order-detail',orderId);
}

function advanceStatus(orderId){
  const o=Store.data.orders.find(x=>x.id===orderId);if(!o)return;
  if(o.status==='submitted'){toast('먼저 견적서를 작성해주세요.');go('quote-builder',orderId);return;}
  if(o.status==='quoted'){toast('고객의 견적 승인을 기다려 주세요.');return;}
  const next=nextStatusFor(o);if(!next)return;
  o.status=next;o.staffId=CU.id;Store.save();
  toast(`✅ 상태 변경: ${STATUS_LABELS[next]}`);render();
}

function cancelOrder(orderId){
  if(!confirm('이 주문을 취소하시겠습니까?'))return;
  const o=Store.data.orders.find(x=>x.id===orderId);if(!o)return;
  o.status='cancelled';Store.save();toast('주문이 취소되었습니다.');go('orders');
}

function sendMsg(orderId){
  const el=document.getElementById('msgInput');
  const text=el?.value.trim();if(!text)return;
  Store.data.messages.push({id:uid(),orderId,senderId:CU.id,text,createdAt:new Date().toISOString()});
  Store.save();el.value='';render();
  setTimeout(()=>{const a=document.getElementById('msgArea');if(a)a.scrollTop=a.scrollHeight},50);
}

          </div>
        </div>
        <div class="flex gap-2">
          ${doc?`<button class="btn-danger text-white text-xs px-3 py-1.5" onclick="removeDoc('${dt.id}')">삭제</button>`:''}

            📤 ${doc?'재업로드':'업로드'}
            <input type="file" style="display:none" accept=".pdf,.jpg,.jpeg,.png" onchange="uploadDoc('${dt.id}',this)">
          </label>
        </div>
      </div>`;}).join('')}
    </div>

function uploadDoc(type,input){
  const file=input?.files?.[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    if(!Store.data.docs)Store.data.docs=[];
    Store.data.docs=Store.data.docs.filter(d=>d.type!==type);
    Store.data.docs.push({type,data:e.target.result,filename:file.name,date:today()});
    Store.save();toast(`✅ ${file.name} 업로드 완료`);render();
  };
  reader.readAsDataURL(file);
}

function removeDoc(type){
  if(!confirm('이 파일을 삭제하시겠습니까?'))return;
  Store.data.docs=(Store.data.docs||[]).filter(d=>d.type!==type);
  Store.save();toast('파일이 삭제되었습니다.');render();
}

      <p class="text-sm text-gray-500 mb-4">현재 모든 데이터는 브라우저 localStorage(키: b2g_v3)에 저장됩니다. 수요자 사이트와 동일한 데이터를 공유합니다.</p>
      <button class="btn-danger text-white px-5 py-2 font-semibold text-sm" onclick="resetAll()">⚠️ 전체 데이터 초기화</button>
    </div>
  </div>`;
}

function saveSettings(){
  const get=id=>document.getElementById(id)?.value||'';
  Store.data.settings={bizName:get('sBizName'),bizNo:get('sBizNo'),ceo:get('sCeo'),phone:get('sPhone'),addr:get('sAddr'),bank:get('sBank')};
  Store.save();toast('✅ 설정이 저장되었습니다.');
}

function resetAll(){
  if(!confirm('모든 데이터가 초기화됩니다. 계속하시겠습니까?'))return;
  localStorage.removeItem(STORAGE_KEY);
  Store.data={users:[],orders:[],quotes:[],messages:[],docs:[],catalog:[],cart:{},mallOrders:[],mileage:{},settings:{bizName:'제천 납품업체',bizNo:'123-45-67890',ceo:'홍길동',phone:'043-123-4567',addr:'충북 제천시 의림대로 126',bank:'농협 301-0012-3456-71'}};
  Store.seed();toast('데이터가 초기화되었습니다.');CU=null;go('login');
}

// ── Toast & bind ───────────────────────────────────────────
function toast(msg){
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  document.body.appendChild(t);setTimeout(()=>t.remove(),3000);
}
function bind(){
  const ma=document.getElementById('msgArea');if(ma)ma.scrollTop=ma.scrollHeight;
}

// ── Init ───────────────────────────────────────────────────
Store.load();
render();
